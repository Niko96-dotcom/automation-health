name: Automation Health CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: SwiftPM build and self-test
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Berlin
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: swift --version

      - name: Build and test
        run: ./script/ci.sh
