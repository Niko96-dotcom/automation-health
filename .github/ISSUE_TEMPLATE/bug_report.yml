name: Bug Report
description: Report a reproducible problem in Automation Health.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      placeholder: |
        1. Open Automation Health
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, Swift/Xcode version if building locally, scheduler source involved, and whether all data is sanitized.
      placeholder: macOS 14.x, Xcode 16.x, launchd or Hermes cron, sanitized examples only
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs Or Screenshots
      description: Do not paste raw logs, screenshots, scheduler output, paths, hostnames, job names, tokens, or secrets. Provide sanitized snippets or summaries only.
      render: text
    validations:
      required: false
